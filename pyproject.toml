[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intentweave"
version = "0.1.0"
description = "Server-side conversation thread state machine with tamper-evident history digests"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.35.0,<2"]
decisions = ["google-genai>=3.2.0,<4"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
intentweave = "intentweave.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/intentweave"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
