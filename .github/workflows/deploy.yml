name: IntentWeave CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# OIDC token permission — required for AWS assume-role without stored keys
permissions:
  id-token: write
  contents: read

env:
  PYTHON_VERSION: "3.11"
  AWS_REGION: us-east-1
  SAM_STACK_NAME: intentweave-prod

jobs:
  # ── Test ─────────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ env.PYTHON_VERSION }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ── Deploy (prod, main only) ──────────────────────────────────────────────────
  deploy:
    name: Deploy → prod
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: intentweave-deploy-${{ github.run_id }}

      - name: SAM build
        run: sam build --parallel

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name "${{ env.SAM_STACK_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --s3-prefix intentweave \
            --parameter-overrides \
              StackEnv=prod \
              SessionTtlDays=7 \
              LambdaMemoryMB=256 \
              LogRetentionDays=14

      - name: Print deployed endpoint
        run: |
          ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name "${{ env.SAM_STACK_NAME }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" \
            --output text)
          echo "API endpoint: $ENDPOINT"
          echo "INTENTWEAVE_ENDPOINT=$ENDPOINT" >> "$GITHUB_ENV"

      - name: Smoke test deployed endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$INTENTWEAVE_ENDPOINT" \
            -H "Content-Type: application/json" \
            -d '{"session_id":"smoke-${{ github.run_id }}","user_message":"book a flight to London"}')
          echo "HTTP status: $STATUS"
          [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 500 ] || exit 1
